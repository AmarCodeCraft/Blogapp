<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ModernBlog - Professional Blogging Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ModernBlog is a professional blogging platform for writers and content creators." />
    <meta name="author" content="AmarCodeCraft" />

    <!-- Icons and Manifest -->
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />

    <!-- SEO & Social -->
    <meta property="og:title" content="ModernBlog" />
    <meta property="og:description" content="Create, share, and engage with ModernBlog." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://modernblog.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://<your-backend>.railway.app;"
    />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_TRACKING_ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "GA_TRACKING_ID");
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- ✅ Correct Vite entry point for React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
